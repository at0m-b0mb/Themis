<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 92" width="492" height="92"
     role="img" aria-label="Themis — exam integrity that states its limits">
  <title>Themis</title>
  <desc>The Themis wordmark: a level balance beside the name.</desc>
  <style>
    /* An SVG loaded through an img element is its own document, so it cannot
       inherit the page's colours -- but it DOES see the viewer's colour scheme.
       That is what makes one file work in a light README and a dark one. Without
       it the name was set in dark ink and vanished against black, which is
       precisely where a wordmark is least forgivable. */
    .mark { stroke: #9A7B28; }
    .mark-fill { fill: #9A7B28; }
    .word { fill: #1B1813; }
    .sub  { fill: #6B6554; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #D9B75C; }
      .mark-fill { fill: #D9B75C; }
      .word { fill: #F3F0E9; }
      .sub  { fill: #8C877C; }
    }
  </style>
  <g transform="translate(6 12)">
    <g class="mark" fill="none" stroke-width="3.4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 20 H62"/>
      <path d="M36 20 V45"/>
      <path d="M36 15.5 V20"/>
      <path d="M28 45 H44"/>
      <path d="M22 52 H50"/>
      <path d="M30.5 45 L27 52 M41.5 45 L45 52"/>
      <path d="M10 20 V26.5"/>
      <path d="M1.6 26.5 Q10 35.5 18.4 26.5"/>
      <path d="M62 20 V26.5"/>
      <path d="M53.6 26.5 Q62 35.5 70.4 26.5"/>
    </g>
    <circle class="mark-fill" cx="36" cy="13" r="2.7"/>
  </g>
  <!-- A font STACK, never a webfont: this file is used in a README and in page
       headers, where an @font-face would either fail to load or drag a network
       request into a mark that has to render offline. -->
  <text class="word" x="104" y="58"
        font-family="Source Serif 4, Iowan Old Style, Palatino, Georgia, serif"
        font-size="44" font-weight="600" letter-spacing="7.5">THEMIS</text>
  <text class="sub" x="107" y="79"
        font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" letter-spacing="2.15">EXAM INTEGRITY THAT STATES ITS LIMITS</text>
</svg>
