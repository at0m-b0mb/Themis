# Themis: keep the MT7921AU's Bluetooth function from ever loading.
#
# On kernel 6.6+ the Bluetooth subsystem causes sporadic Wi-Fi crashes with
# mt7921u. The AWUS036AXML integrates Bluetooth 5.2, so this applies to it
# directly, and a radio crash mid-exam is the worst failure this project has.
#
# Install to /etc/modprobe.d/blacklist-themis-bt.conf, then:
#   sudo systemctl disable --now bluetooth
#   sudo reboot        (or: sudo modprobe -r btusb btmtk)
#
# This is inside the exam VM only. The host machine's Bluetooth is unaffected.

blacklist btusb
blacklist btmtk
blacklist btintel
